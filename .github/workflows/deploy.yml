name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Assemble site layout
        run: |
          cp index.html dist/index.html
          mkdir -p dist/old
          cp old/index.html old/map.png old/regions.js dist/old/ 2>/dev/null || true
          node scripts/gen-data.js dist/old
          cp 404.html dist/404.html 2>/dev/null || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5